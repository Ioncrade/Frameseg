[project]
name = "frameseg-backend"
version = "0.1.0"
description = "FrameSeg video segmentation backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "av>=16.0.1",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
