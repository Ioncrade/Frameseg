name: openframe

services:
  backend:
    image: ${DOCKERHUB_USERNAME:-ioncrade}/openframe-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      FRAMESEG_HOST: 0.0.0.0
      FRAMESEG_PORT: 8000
      FRAMESEG_DATA_ROOT: /data
      FRAMESEG_PRELOAD_MODEL: ${FRAMESEG_PRELOAD_MODEL:-true}
      FRAMESEG_OFFLOAD_STATE_TO_CPU: ${FRAMESEG_OFFLOAD_STATE_TO_CPU:-false}
      FRAMESEG_OUTPUT_CODEC: ${FRAMESEG_OUTPUT_CODEC:-prores_4444}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - frameseg-data:/data
      - frameseg-model-cache:/cache/huggingface
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

  frontend:
    image: ${DOCKERHUB_USERNAME:-ioncrade}/openframe-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
        restart: true

volumes:
  frameseg-data:
  frameseg-model-cache:
